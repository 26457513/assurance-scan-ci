# Trusted reusable workflow. Consumer repositories call this file from their
# own generated .github/workflows/assurance-scan.yml.
#
# The default tracks signed `latest` images but resolves and runs their exact
# digests. Controlled environments may replace either value with :vX.Y.Z or
# @sha256:<digest> after choosing an approved immutable release.

name: assurance-scan

on:
  workflow_call:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  ASSURANCE_SCAN_URL: https://scan.squease.ai
  ASSURANCE_SCAN_CI_IMAGE: ghcr.io/26457513/assurance-scan-ci:latest
  ASSURANCE_SCAN_UPLOAD_IMAGE: ghcr.io/26457513/assurance-scan-ci-upload:latest

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the signed event revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Resolve and verify signed Assurance Scan images
        id: images
        shell: bash
        run: |
          set -euo pipefail
          issuer='https://token.actions.githubusercontent.com'
          identity='https://github.com/26457513/assurance-scan/.github/workflows/publish-ghcr.yml@refs/heads/main'
          ci_digest=$(docker buildx imagetools inspect "$ASSURANCE_SCAN_CI_IMAGE" --format '{{.Manifest.Digest}}')
          upload_digest=$(docker buildx imagetools inspect "$ASSURANCE_SCAN_UPLOAD_IMAGE" --format '{{.Manifest.Digest}}')
          cosign verify "ghcr.io/26457513/assurance-scan-ci@$ci_digest" \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          cosign verify "ghcr.io/26457513/assurance-scan-ci-upload@$upload_digest" \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          cosign verify-attestation "ghcr.io/26457513/assurance-scan-ci@$ci_digest" \
            --type custom --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" > "$RUNNER_TEMP/assurance-scan-release.json"
          python3 - "$ci_digest" "$upload_digest" "$RUNNER_TEMP/assurance-scan-release.json" <<'PY'
          import base64
          import json
          import re
          import sys

          ci_digest, upload_digest, path = sys.argv[1:]
          with open(path, encoding="utf-8") as stream:
              envelopes = json.load(stream)
          if isinstance(envelopes, dict):
              envelopes = [envelopes]
          predicates = []
          for envelope in envelopes:
              payload = envelope.get("payload", "")
              payload += "=" * (-len(payload) % 4)
              statement = json.loads(base64.b64decode(payload))
              predicate = statement.get("predicate")
              if isinstance(predicate, dict) and isinstance(predicate.get("Data"), str):
                  predicate = json.loads(predicate["Data"])
              predicates.append(predicate)
          matched = any(
              isinstance(item, dict)
              and item.get("schema_version") == 1
              and re.fullmatch(r"[0-9a-f]{40}", str(item.get("revision", "")))
              and item.get("producer") == f"ghcr.io/26457513/assurance-scan-ci@{ci_digest}"
              and item.get("uploader") == f"ghcr.io/26457513/assurance-scan-ci-upload@{upload_digest}"
              for item in predicates
          )
          if not matched:
              raise SystemExit("signed Assurance Scan release manifest does not match resolved images")
          PY
          printf 'ci=%s\n' "ghcr.io/26457513/assurance-scan-ci@$ci_digest" >> "$GITHUB_OUTPUT"
          printf 'upload=%s\n' "ghcr.io/26457513/assurance-scan-ci-upload@$upload_digest" >> "$GITHUB_OUTPUT"

      - name: Produce immutable scan bundle
        shell: bash
        env:
          CI_IMAGE: ${{ steps.images.outputs.ci }}
        run: |
          set -euo pipefail
          bundle_parent="$RUNNER_TEMP/assurance-scan-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$bundle_parent"
          printf 'BUNDLE_PARENT=%s\n' "$bundle_parent" >> "$GITHUB_ENV"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/workspace,readonly \
            --mount type=bind,src="$bundle_parent",dst=/output \
            -e GITHUB_REPOSITORY -e GITHUB_REPOSITORY_ID -e GITHUB_REPOSITORY_OWNER_ID \
            -e GITHUB_SERVER_URL \
            -e GITHUB_RUN_ID -e GITHUB_RUN_NUMBER -e GITHUB_RUN_ATTEMPT \
            -e GITHUB_EVENT_NAME -e GITHUB_REF -e GITHUB_SHA \
            -e GITHUB_HEAD_REF -e GITHUB_BASE_REF \
            -e GITHUB_WORKFLOW_REF -e GITHUB_WORKFLOW_SHA -e GITHUB_ACTOR -e GITHUB_ACTOR_ID \
            "$CI_IMAGE" /workspace --output /output/bundle \
            --scanner-snapshot-path "$bundle_parent/bundle/.source-snapshot"
          cat "$bundle_parent/bundle/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded diagnostic bundle
        if: always() && env.BUNDLE_PARENT != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: assurance-scan-results
          path: ${{ env.BUNDLE_PARENT }}/bundle
          if-no-files-found: ignore
          retention-days: 7

      - name: Push result to Assurance Scan
        shell: bash
        env:
          UPLOAD_IMAGE: ${{ steps.images.outputs.upload }}
        run: |
          set -euo pipefail
          set +x
          audience="$ASSURANCE_SCAN_URL/api/v2/ingest/github-actions"
          encoded_audience=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$audience")

          request_oidc() {
            local response token
            response=$(printf 'header = "Authorization: bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" | \
              curl --silent --show-error --fail --max-time 10 --proto '=https' \
                --config - "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}") || return 75
            token=$(printf '%s' "$response" | python3 -c \
              'import json,sys; value=json.load(sys.stdin).get("value"); assert isinstance(value,str); sys.stdout.write(value)') || return 75
            printf '::add-mask::%s\n' "$token" >&2
            printf '%s' "$token"
          }

          for attempt in 1 2 3 4; do
            set +e
            request_oidc | docker run --rm -i \
              --read-only --user 65532:65532 --cap-drop ALL \
              --security-opt no-new-privileges \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              --mount type=bind,src="$BUNDLE_PARENT/bundle",dst=/bundle,readonly \
              "$UPLOAD_IMAGE" --url "$ASSURANCE_SCAN_URL" --bundle /bundle
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -ne 75 ] || [ "$attempt" -eq 4 ]; then exit "$status"; fi
            case "$attempt" in 1) ceiling=1;; 2) ceiling=3;; *) ceiling=9;; esac
            sleep "$((RANDOM % (ceiling + 1)))"
          done

      - name: Add Assurance Scan result link
        shell: bash
        run: |
          set -euo pipefail
          scan_url="$ASSURANCE_SCAN_URL/scans/gh-$GITHUB_REPOSITORY_ID-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '\n[View the full scan in Assurance Scan](%s)\n' "$scan_url" | tee -a \
            "$BUNDLE_PARENT/bundle/summary.md" "$GITHUB_STEP_SUMMARY" >/dev/null

      - name: Publish PR scan summary
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: assurance-scan
          path: ${{ env.BUNDLE_PARENT }}/bundle/summary.md
