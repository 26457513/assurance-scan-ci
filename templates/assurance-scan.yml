# Generated by Assurance Scan. Commit this file as
# .github/workflows/assurance-scan.yml on the repository's default branch.
# This public copy assumes that branch is named `main`. If it is not, replace
# both `main` values under `on` with the repository's actual default branch.

name: assurance-scan

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch ref selected by Assurance Scan
        required: true
        type: string
      target_sha:
        description: Immutable commit SHA selected by Assurance Scan
        required: true
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: assurance-scan-${{ github.event.pull_request.number || inputs.target_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  scan:
    if: >-
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       github.event.pull_request.draft == false)
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    # Public workflow orchestration; scanner implementation remains in signed
    # public images and the Assurance Scan application source stays private.
    uses: 26457513/assurance-scan-ci/.github/workflows/scan.yml@e16230170b318600b67883696d825ff90c61088a
    with:
      target_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || '' }}
      target_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || '' }}
