# Generated by Assurance Scan. Commit this file as
# .github/workflows/assurance-scan.yml on the repository's default branch.
# This public copy assumes that branch is named `main`. If it is not, replace
# both `main` values under `on` with the repository's actual default branch.

name: assurance-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: assurance-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    if: >-
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       github.event.pull_request.draft == false)
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    # Public workflow orchestration; scanner implementation remains in signed
    # public images and the Assurance Scan application source stays private.
    uses: 26457513/assurance-scan-ci/.github/workflows/scan.yml@main # nosemgrep: backend.assurance-scan.github-actions-mutable-reference
